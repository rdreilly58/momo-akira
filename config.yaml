# momo-akira v2 configuration — PyramidSD token-level speculative decoding
# All three models MUST share the same tokenizer (same model family).
# Swap any model by changing model_id — zero code changes required.

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  host: "127.0.0.1"
  port: 7780

# ---------------------------------------------------------------------------
# Models — three tiers (must share tokenizer)
# device: "auto" detects MPS (Apple Silicon) / CUDA / CPU automatically
# dtype: float16 | bfloat16 | int8 | int4
# ---------------------------------------------------------------------------
models:
  family: "qwen2.5"  # documents which tokenizer family; all three must match
  draft:
    model_id: "Qwen/Qwen2.5-0.5B-Instruct"
    device: "cpu"
    dtype: "float16"       # ~1 GB
  qualifier:
    model_id: "Qwen/Qwen2.5-1.5B-Instruct"
    device: "auto"
    dtype: "int4"          # ~0.75 GB
  target:
    model_id: "Qwen/Qwen2.5-3B-Instruct"
    device: "auto"
    dtype: "int4"          # ~1.5 GB  (total ~3.25 GB)

# ---------------------------------------------------------------------------
# Decoding
# variant: psda (Assisted — stable) or psdf (Fuzzy — faster, higher variance)
# speculative_length_d: l_D — how many tokens the draft proposes per batch
# speculative_length_q: l_Q — how many qualifier-verified tokens to accumulate
#                            before invoking the target
# tau_q: divergence threshold for draft→qualifier gate (|logit_D - logit_Q| ≤ tau_q)
# tau_t: divergence threshold for qualifier→target gate (|logit_Q - logit_T| ≤ tau_t)
# Recommendation from paper: tau_q ≤ tau_t, l_D ≈ l_Q / 2
# ---------------------------------------------------------------------------
decoding:
  variant: "psda"
  speculative_length_d: 4    # l_D
  speculative_length_q: 10   # l_Q
  tau_q: 0.3                 # draft→qualifier threshold
  tau_t: 0.4                 # qualifier→target threshold
  temperature: 0.7
  max_new_tokens: 256

# ---------------------------------------------------------------------------
# Adaptive threshold controller
# Tunes tau_q and tau_t at runtime to hit target acceptance rates.
# ---------------------------------------------------------------------------
adaptive:
  enabled: true
  target_draft_acceptance: 0.70    # fraction of draft tokens accepted by qualifier
  target_qualifier_acceptance: 0.80  # fraction of qualifier tokens accepted by target
  learning_rate: 0.05
  warmup_tokens: 500

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  log_dir: "./logs"
  enabled: true
