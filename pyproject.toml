[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momo-akira"
version = "0.1.0"
description = "OpenAI-compatible proxy implementing PyramidSD 3-tier speculative decoding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "anthropic>=0.39.0",
    "openai>=1.57.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.0.1",
]

[project.scripts]
momo-akira = "momo_akira.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/momo_akira"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/momo_akira --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/momo_akira"]
omit = ["*/tests/*"]
